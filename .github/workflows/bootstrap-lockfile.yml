name: One-time M0 lockfile bootstrap

# TEMPORARY: runs only when this file is committed to main.
# Remove after package-lock.json is committed.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-lockfile.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate reproducible lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(m0): lock npm dependencies'
            git push origin HEAD:main
          fi
