name: Temporary M1 dependency lock bootstrap

# Temporary branch-scoped workflow. Retrying with official compatible SDK peer versions.
on:
  push:
    branches: [feat/m1-secure-resource]
    paths: ['.github/workflows/m1-lock-bootstrap.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lockfile without running install scripts
        id: lock
        continue-on-error: true
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Record outcome
        if: always()
        run: |
          mkdir -p docs
          printf '%s\n'             '# M1 dependency bootstrapping'             ''             "Result: ${{ steps.lock.outcome }}"             "Run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"             ''             'Temporary workflow: remove after lockfile validation.'             > docs/m1-bootstrap-status.md
          git add docs/m1-bootstrap-status.md
          if [ "${{ steps.lock.outcome }}" = "success" ]; then
            git add package-lock.json
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(m1): record dependency resolution status'
          git push origin HEAD:feat/m1-secure-resource
      - name: Fail if resolution failed
        if: steps.lock.outcome != 'success'
        run: exit 1
