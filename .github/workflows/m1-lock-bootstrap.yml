name: Temporary M1 dependency lock bootstrap

# Temporary branch-scoped workflow, removed after successful lock generation.
on:
  push:
    branches: [feat/m1-secure-resource]
    paths: ['.github/workflows/m1-lock-bootstrap.yml']

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate lockfile without running install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit verified lockfile
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(m1): lock MCP v2 and OAuth dependencies'
            git push origin HEAD:feat/m1-secure-resource
          fi
