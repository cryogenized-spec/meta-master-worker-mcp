name: Temporary Baileys bridge lock bootstrap

# Trusted branch-only, one-time lock generation. Delete immediately after.
on:
  push:
    branches: [feat/baileys-bridge-prototype]
    paths:
      - '.github/workflows/baileys-bridge-lock.yml'

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate isolated bridge dependency lockfile
        run: cd apps/baileys-bridge && npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit bridge lockfile
        run: |
          git add apps/baileys-bridge/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(baileys): pin isolated bridge dependencies'
            git push origin HEAD:feat/baileys-bridge-prototype
          fi
