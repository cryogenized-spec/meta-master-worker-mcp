name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck and tests
        run: npm run check
      - name: Validate Worker bundle without deployment
        run: npm run build
      - name: Validate WhatsApp staging Worker template without deployment
        run: npx --no-install wrangler deploy -c wrangler.whatsapp.example.jsonc --dry-run --outdir dist-whatsapp
      - name: Validate private staging secret generation
        run: |
          bash -n scripts/generate-whatsapp-staging-secrets.sh
          bash scripts/generate-whatsapp-staging-secrets.sh
          test "$(stat -c '%a' .private/whatsapp-staging.env)" = '600'
          if bash scripts/generate-whatsapp-staging-secrets.sh; then
            echo "Unexpected private secret overwrite!"
            exit 1
          fi
      - name: Validate offline-only Wrangler secret installer syntax and default refusal
        run: |
          bash -n scripts/install-whatsapp-staging-secrets.sh
          if bash scripts/install-whatsapp-staging-secrets.sh; then
            echo "Installer unexpectedly accepted missing private secrets."
            exit 1
          fi
      - name: Install isolated Baileys observer dependencies
        run: npm ci --prefix apps/baileys-bridge --no-audit --no-fund
      - name: Compile and test observation-only Baileys bridge
        run: npm test --prefix apps/baileys-bridge
      - name: Verify offline Baileys operator commands
        run: |
          npm run doctor --prefix apps/baileys-bridge
          npm run selftest --prefix apps/baileys-bridge
      - name: Verify live replay acceptance command defaults to disabled
        run: npm run replay-smoke --prefix apps/baileys-bridge
      - name: Verify synthetic ingress command is disabled by default
        run: npm run smoke --prefix apps/baileys-bridge
      - name: Build portable future Baileys container image (no pairing)
        run: docker build -f apps/baileys-bridge/Dockerfile -t baileys-bridge-ci apps/baileys-bridge
      - name: Verify future container cannot connect by default
        run: |
          result="$(docker run --rm baileys-bridge-ci)"
          test "$result" = 'Baileys bridge disabled (default). No connection attempted.'
