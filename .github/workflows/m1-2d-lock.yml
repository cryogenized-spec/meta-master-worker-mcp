name: Temporary M1.2d lockfile bootstrap

# One-time, branch-scoped dependency lock update. Remove after the run.
on:
  push:
    branches: [feat/m1-2d-local-integration]
    paths: ['.github/workflows/m1-2d-lock.yml']

permissions:
  contents: write

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve locked Miniflare dependency (no install scripts)
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to feature branch
        run: |
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'build(m1.2d): lock Miniflare for local integration'
            git push origin HEAD:feat/m1-2d-local-integration
          fi
